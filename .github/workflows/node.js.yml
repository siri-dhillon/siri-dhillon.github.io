name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a deploy that's already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Detect Pages URL
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Type-check & validate content
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Host-agnostic: the site only reads these two variables.
          # On Pages they come from the repo's Pages settings (custom domain aware);
          # a repo variable SITE_URL overrides them.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin || 'https://siri-dhillon.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
